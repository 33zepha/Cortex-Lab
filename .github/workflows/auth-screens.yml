name: UI Screens

on:
  pull_request:
    branches: [main]
    paths:
      - "index.html"
      - "src/main.tsx"
      - "src/screens/AuthScreen.tsx"
      - "src/components/auth/**"
      - "src/components/effects/**"
      - "src/components/shell/**"
      - "src/components/operator/**"
      - "src/lib/operator-*.ts"
      - "src/lib/useMissions.ts"
      - "src/screens/**"
      - "src/components/ui/LiquidSurface.tsx"
      - "src/styles/auth.css"
      - "src/styles/auth-actions.css"
      - "src/styles/auth-effects.css"
      - "src/styles/auth-hero.css"
      - "src/styles/app-continuity.css"
      - "src/styles/liquid-surface.css"
      - "assets/auth/**"
      - "scripts/materialize-auth-hero.mjs"
      - "backend/scripts/screenshot-auth.ts"
      - "backend/scripts/screenshot-app.ts"
      - ".github/workflows/auth-screens.yml"

permissions:
  contents: write

concurrency:
  group: ui-screens-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  capture:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start preview
        run: |
          npm run preview -- --host 127.0.0.1 > /tmp/cortex-preview.log 2>&1 &
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/login >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/cortex-preview.log
          exit 1

      - name: Capture auth UI
        run: npx tsx backend/scripts/screenshot-auth.ts

      - name: Capture app continuity UI
        run: npx tsx backend/scripts/screenshot-app.ts

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/ui/auth-*.png artifacts/ui/app-*.png artifacts/ui/app-*.jpg
          if git diff --cached --quiet; then
            echo "Screenshots unchanged"
            exit 0
          fi
          git commit -m "chore(ui): refresh UI screenshots"
          git push
